<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Offline EPUB Reader</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121212;color:#eee;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{width:100%;height:100%;display:flex;flex-direction:column}
#toolbar{height:58px;min-height:58px;display:flex;align-items:center;gap:7px;padding:7px 10px;background:#1b1b1b;border-bottom:1px solid #333}
button{border:0;border-radius:7px;padding:8px 11px;background:#303030;color:#eee;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:hover{background:#404040}
button:active{background:#4b4b4b}
#addButton{background:#1769aa}
#addButton:hover{background:#1d7fc7}
#fileInput{display:none}
#title{flex:1;min-width:0;text-align:center;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ddd}
#gotoContainer{display:flex;align-items:center;gap:4px}
#gotoInput{width:54px;padding:7px 5px;border:0;border-radius:7px;background:#303030;color:#eee;font:inherit;text-align:center}
#gotoInput:focus{outline:1px solid #1769aa}
#settingsButton{font-size:18px;padding:7px 10px}
#settings{position:fixed;top:58px;right:10px;width:270px;max-width:calc(100vw - 20px);background:#222;border:1px solid #444;border-radius:10px;padding:15px;z-index:80;box-shadow:0 8px 30px #000b;display:none}
#settings.open{display:block}
.settingGroup{margin-bottom:15px}
.settingGroup:last-child{margin-bottom:0}
.settingLabel{display:block;color:#aaa;font-size:12px;margin-bottom:7px}
.optionRow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.optionRow button{padding:7px 3px;font-size:12px}
.optionRow button.active{background:#1769aa;color:#fff}
#reader{position:relative;flex:1;min-height:0;width:100%;overflow:hidden;background:#121212}
#wordPage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:35px;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
#text{width:100%;max-width:850px;max-height:100%;overflow:hidden;color:#eee;font-family:Georgia,"Times New Roman",serif;font-size:22px;line-height:1.8;text-align:justify;text-justify:inter-word;overflow-wrap:break-word}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:#888;font-size:17px;line-height:1.7}
#empty strong{color:#ddd}
#chapterInfo{position:absolute;left:0;right:0;bottom:12px;text-align:center;pointer-events:none;color:#666;font-size:12px}
#library{position:fixed;left:0;top:0;bottom:0;width:340px;max-width:90vw;background:#1d1d1d;z-index:50;transform:translateX(-100%);transition:transform .2s ease;box-shadow:8px 0 30px #0009;display:flex;flex-direction:column}
#library.open{transform:translateX(0)}
#libraryHeader{height:58px;min-height:58px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #333}
#libraryHeader h2{margin:0;flex:1;font-size:18px}
#bookList{flex:1;overflow-y:auto;padding:10px}
.book{position:relative;padding:14px 42px 14px 14px;margin-bottom:9px;background:#2a2a2a;border-radius:8px;cursor:pointer}
.book:hover{background:#353535}
.book.active{background:#263f52;border:1px solid #1769aa}
.bookTitle{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bookInfo{margin-top:5px;color:#888;font-size:12px;line-height:1.5}
.bookProgress{margin-top:8px;height:4px;background:#444;border-radius:4px;overflow:hidden}
.bookProgressBar{height:100%;background:#1769aa;border-radius:4px}
.deleteBook{position:absolute;right:7px;top:7px;padding:3px 8px;background:transparent;color:#888}
.deleteBook:hover{color:#ff6666;background:#444}
#emptyLibrary{color:#888;text-align:center;padding:30px 15px;line-height:1.6}
#loading{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#121212;color:#aaa}
#error{position:fixed;left:15px;right:15px;bottom:20px;z-index:100;padding:12px 15px;background:#9d2020;color:#fff;border-radius:8px;display:none}
@media(max-width:700px){
#toolbar{height:54px;min-height:54px;padding:6px;gap:4px}
button{padding:7px 9px;font-size:12px}
#title{font-size:12px}
#gotoInput{width:45px;padding:7px 3px;font-size:12px}
#settings{top:54px;right:6px}
#wordPage{padding:22px 18px 40px}
#text{font-size:20px;line-height:1.75}
}
@media(max-width:430px){
#libraryButton{font-size:0;padding:8px}
#libraryButton::before{content:"☰";font-size:18px}
#addButton{font-size:0;padding:8px}
#addButton::before{content:"+";font-size:20px}
#gotoButton{font-size:0;padding:8px}
#gotoButton::before{content:"%";font-size:16px}
#settingsButton{font-size:17px;padding:7px}
#title{max-width:85px}
}
@media(max-width:380px){
#gotoInput{width:40px}
#text{font-size:19px}
}
</style>
</head>
<body>
<div id="app">
<div id="toolbar">
<button id="libraryButton">☰ Library</button>
<button id="addButton">+ Add Book</button>
<input id="fileInput" type="file" accept=".epub">
<div id="gotoContainer">
<input id="gotoInput" type="number" min="0" max="100" step="1" placeholder="%">
<button id="gotoButton">Go</button>
</div>
<button id="settingsButton">⚙</button>
<span id="title">No book loaded</span>
</div>
<div id="settings">
<div class="settingGroup">
<span class="settingLabel">FONT</span>
<div class="optionRow">
<button data-font="Georgia">Georgia</button>
<button data-font="Arial">Arial</button>
<button data-font="Verdana">Verdana</button>
<button data-font="Tahoma">Tahoma</button>
<button data-font="Courier New">Mono</button>
</div>
</div>
<div class="settingGroup">
<span class="settingLabel">FONT SIZE</span>
<div class="optionRow">
<button data-size="18">18</button>
<button data-size="20">20</button>
<button data-size="22">22</button>
<button data-size="26">26</button>
<button data-size="30">30</button>
</div>
</div>
</div>
<div id="reader">
<div id="wordPage"><div id="text"></div></div>
<div id="empty"><div><strong>No book loaded</strong><br><br>Click <b>+ Add Book</b> to choose one or more EPUB files.<br><br>Tap the right side to move forward.<br>Swipe left/right on mobile to navigate.</div></div>
<div id="loading">Loading...</div>
<div id="chapterInfo"></div>
</div>
</div>
<div id="library">
<div id="libraryHeader">
<h2>My Library</h2>
<button id="closeLibrary">×</button>
</div>
<div id="bookList"></div>
</div>
<div id="error"></div>
<script>
"use strict";

const WORDS_PER_PAGE=20;
const DB_NAME="OfflineMultiEPUBReader";
const DB_VERSION=3;
const STORE_NAME="data";
const BOOKS_KEY="books";
const LAST_BOOK_KEY="last-book";
const SETTINGS_KEY="reader-settings";

let db=null;
let books=[];
let currentBook=null;
let words=[];
let currentWordPage=0;
let totalWordPages=0;
let touchStartX=0;
let touchStartY=0;
let settings={font:"Georgia",size:22};

const textElement=document.getElementById("text");
const wordPageElement=document.getElementById("wordPage");
const emptyElement=document.getElementById("empty");
const loadingElement=document.getElementById("loading");
const titleElement=document.getElementById("title");
const chapterInfoElement=document.getElementById("chapterInfo");
const fileInput=document.getElementById("fileInput");
const libraryElement=document.getElementById("library");
const bookListElement=document.getElementById("bookList");
const errorElement=document.getElementById("error");
const gotoInput=document.getElementById("gotoInput");
const gotoButton=document.getElementById("gotoButton");
const settingsButton=document.getElementById("settingsButton");
const settingsElement=document.getElementById("settings");

function openDB(){
return new Promise((resolve,reject)=>{
const request=indexedDB.open(DB_NAME,DB_VERSION);
request.onupgradeneeded=event=>{
const database=event.target.result;
if(!database.objectStoreNames.contains(STORE_NAME))database.createObjectStore(STORE_NAME);
};
request.onsuccess=event=>{
db=event.target.result;
db.onversionchange=()=>db.close();
resolve(db);
};
request.onerror=()=>reject(request.error||new Error("Could not open database."));
request.onblocked=()=>reject(new Error("Database upgrade is blocked by another browser tab."));
});
}

async function requestPersistentStorage(){
if(!navigator.storage)return false;
try{
if(await navigator.storage.persisted())return true;
if(navigator.storage.persist)return await navigator.storage.persist();
}catch(error){
console.warn("Persistent storage request failed:",error);
}
return false;
}

function ensureDatabase(){
if(!db)throw new Error("Database is not open.");
if(!db.objectStoreNames.contains(STORE_NAME))throw new Error("Database storage is unavailable. Clear this site's data and reload.");
}

function saveData(key,value){
return new Promise((resolve,reject)=>{
try{
ensureDatabase();
const tx=db.transaction(STORE_NAME,"readwrite");
tx.objectStore(STORE_NAME).put(value,key);
tx.oncomplete=()=>resolve();
tx.onerror=()=>reject(tx.error||new Error("Database write failed."));
tx.onabort=()=>reject(tx.error||new Error("Database write was aborted."));
}catch(error){reject(error)}
});
}

function getData(key){
return new Promise((resolve,reject)=>{
try{
ensureDatabase();
const tx=db.transaction(STORE_NAME,"readonly");
const request=tx.objectStore(STORE_NAME).get(key);
request.onsuccess=()=>resolve(request.result);
request.onerror=()=>reject(request.error||new Error("Database read failed."));
tx.onerror=()=>reject(tx.error||new Error("Database transaction failed."));
}catch(error){reject(error)}
});
}

function u16(array,offset){
return array[offset]|(array[offset+1]<<8);
}

function u32(array,offset){
return(array[offset]|(array[offset+1]<<8)|(array[offset+2]<<16)|(array[offset+3]<<24))>>>0;
}

function decodeText(bytes){
return new TextDecoder("utf-8").decode(bytes);
}

async function inflateRaw(data){
if(typeof DecompressionStream==="undefined")throw new Error("This browser does not support EPUB ZIP decompression.");
const stream=new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
return new Uint8Array(await new Response(stream).arrayBuffer());
}

class ZipReader{
constructor(buffer){
this.data=new Uint8Array(buffer);
this.files=new Map();
this.readDirectory();
}
readDirectory(){
const a=this.data;
let eocd=-1;
for(let i=a.length-22;i>=Math.max(0,a.length-66000);i--){
if(a[i]===0x50&&a[i+1]===0x4b&&a[i+2]===0x05&&a[i+3]===0x06){
eocd=i;
break;
}
}
if(eocd<0)throw new Error("Invalid EPUB ZIP structure.");
const count=u16(a,eocd+10);
const offset=u32(a,eocd+16);
let position=offset;
for(let i=0;i<count;i++){
if(a[position]!==0x50||a[position+1]!==0x4b||a[position+2]!==0x01||a[position+3]!==0x02)throw new Error("Invalid ZIP central directory.");
const method=u16(a,position+10);
const compressedSize=u32(a,position+20);
const nameLength=u16(a,position+28);
const extraLength=u16(a,position+30);
const commentLength=u16(a,position+32);
const localOffset=u32(a,position+42);
const name=decodeText(a.slice(position+46,position+46+nameLength));
this.files.set(name,{method,compressedSize,localOffset});
position+=46+nameLength+extraLength+commentLength;
}
}
has(name){
return this.files.has(name.replace(/^\/+/,""));
}
async get(name){
name=name.replace(/^\/+/,"");
const info=this.files.get(name);
if(!info)throw new Error("File not found: "+name);
const a=this.data;
const position=info.localOffset;
const nameLength=u16(a,position+26);
const extraLength=u16(a,position+28);
const start=position+30+nameLength+extraLength;
const compressed=a.slice(start,start+info.compressedSize);
if(info.method===0)return compressed;
if(info.method===8)return await inflateRaw(compressed);
throw new Error("Unsupported ZIP compression method.");
}
}

function normalizePath(path){
const parts=[];
for(const part of path.split("/")){
if(!part||part===".")continue;
if(part==="..")parts.pop();
else parts.push(part);
}
return parts.join("/");
}

function dirname(path){
const index=path.lastIndexOf("/");
return index<0?"":path.slice(0,index);
}

function resolvePath(base,relative){
if(relative.startsWith("/"))return normalizePath(relative);
return normalizePath(base?base+"/"+relative:relative);
}

class EPUBBook{
constructor(buffer){
this.zip=new ZipReader(buffer);
this.basePath="";
this.manifest=new Map();
this.chapters=[];
}
async open(){
if(!this.zip.has("mimetype"))throw new Error("This file is not a valid EPUB.");
const container=new DOMParser().parseFromString(decodeText(await this.zip.get("META-INF/container.xml")),"application/xml");
const rootfile=container.querySelector("rootfile");
if(!rootfile)throw new Error("EPUB package file not found.");
const opfPath=rootfile.getAttribute("full-path");
if(!opfPath)throw new Error("EPUB package path is missing.");
this.basePath=dirname(opfPath);
const opf=new DOMParser().parseFromString(decodeText(await this.zip.get(opfPath)),"application/xml");
for(const item of opf.querySelectorAll("manifest > item")){
const id=item.getAttribute("id");
const href=item.getAttribute("href");
if(!id||!href)continue;
this.manifest.set(id,{href,mediaType:item.getAttribute("media-type"),properties:item.getAttribute("properties")||""});
}
const spine=opf.querySelector("spine");
if(!spine)throw new Error("EPUB has no spine.");
for(const ref of spine.querySelectorAll("itemref")){
const id=ref.getAttribute("idref");
const item=this.manifest.get(id);
if(!item)continue;
this.chapters.push({id,path:resolvePath(this.basePath,decodeURIComponent(item.href.split("#")[0])),title:"Chapter "+(this.chapters.length+1)});
}
await this.loadNavigation(opf);
if(!this.chapters.length)throw new Error("No readable chapters found.");
}
async loadNavigation(opf){
for(const item of this.manifest.values()){
if(item.properties.split(/\s+/).includes("nav")){
const path=resolvePath(this.basePath,decodeURIComponent(item.href));
await this.parseNavigation(path);
return;
}
}
const spine=opf.querySelector("spine");
if(!spine)return;
const tocId=spine.getAttribute("toc");
if(!tocId||!this.manifest.has(tocId))return;
const item=this.manifest.get(tocId);
const path=resolvePath(this.basePath,decodeURIComponent(item.href));
await this.parseNCX(path);
}
async parseNCX(path){
try{
const doc=new DOMParser().parseFromString(decodeText(await this.zip.get(path)),"application/xml");
for(const point of doc.querySelectorAll("navPoint")){
const label=point.querySelector("navLabel text");
const content=point.querySelector("content");
if(!label||!content)continue;
const src=content.getAttribute("src");
if(!src)continue;
const target=resolvePath(dirname(path),decodeURIComponent(src.split("#")[0]));
const index=this.chapters.findIndex(chapter=>chapter.path===target);
if(index>=0){
const title=label.textContent.trim();
if(title)this.chapters[index].title=title;
}
}
}catch(error){console.warn("Could not read NCX:",error)}
}
async parseNavigation(path){
try{
const doc=new DOMParser().parseFromString(decodeText(await this.zip.get(path)),"application/xhtml+xml");
for(const link of doc.querySelectorAll("nav a")){
const href=link.getAttribute("href");
if(!href)continue;
const target=resolvePath(dirname(path),decodeURIComponent(href.split("#")[0]));
const index=this.chapters.findIndex(chapter=>chapter.path===target);
if(index>=0){
const title=link.textContent.trim();
if(title)this.chapters[index].title=title;
}
}
}catch(error){console.warn("Could not read navigation:",error)}
}
async getChapter(index){
const chapter=this.chapters[index];
if(!chapter)return null;
const bytes=await this.zip.get(chapter.path);
return{index,path:chapter.path,title:chapter.title,html:decodeText(bytes)};
}
}

async function extractChapterText(chapter){
const parser=new DOMParser();
const document=parser.parseFromString(chapter.html,"text/html");
document.querySelectorAll("script,style,noscript,iframe,object,embed").forEach(element=>element.remove());
let result=document.body?document.body.innerText:document.documentElement.innerText;
return result.replace(/\u00a0/g," ").replace(/\s+/g," ").trim();
}

async function loadBookText(book){
const result=[];
for(let i=0;i<book.chapters.length;i++){
const chapter=await book.getChapter(i);
if(!chapter)continue;
const chapterText=await extractChapterText(chapter);
if(chapterText)result.push(chapterText);
}
return result.join(" ");
}

function splitWords(text){
if(!text)return[];
return text.trim().split(/\s+/).filter(word=>word.length>0);
}

function getCurrentPercentage(){
if(!totalWordPages)return 0;
if(totalWordPages===1)return 100;
return Math.round((currentWordPage/(totalWordPages-1))*100);
}

function showWordPage(){
if(!words.length){
textElement.textContent="This book contains no readable text.";
chapterInfoElement.textContent="";
return;
}
totalWordPages=Math.ceil(words.length/WORDS_PER_PAGE);
currentWordPage=Math.max(0,Math.min(currentWordPage,totalWordPages-1));
const start=currentWordPage*WORDS_PER_PAGE;
const end=Math.min(start+WORDS_PER_PAGE,words.length);
textElement.textContent=words.slice(start,end).join(" ");
chapterInfoElement.textContent=(currentWordPage+1)+" / "+totalWordPages+" ("+getCurrentPercentage()+"%)";
titleElement.textContent=currentBook?currentBook.name:"No book loaded";
saveCurrentPosition();
}

function nextWords(){
if(!words.length)return;
if(currentWordPage<totalWordPages-1){
currentWordPage++;
showWordPage();
}
}

function previousWords(){
if(!words.length)return;
if(currentWordPage>0){
currentWordPage--;
showWordPage();
}
}

function goToPercentage(){
if(!words.length){
showError("No book is currently open.");
return;
}
let value=parseFloat(gotoInput.value);
if(!Number.isFinite(value)){
showError("Enter a percentage from 0 to 100.");
return;
}
value=Math.max(0,Math.min(100,value));
currentWordPage=Math.round((value/100)*(totalWordPages-1));
showWordPage();
gotoInput.value="";
}

function getBookById(id){
return books.find(book=>book.id===id)||null;
}

async function saveBooks(){
await saveData(BOOKS_KEY,books);
}

async function saveCurrentPosition(){
if(!currentBook)return;
const book=getBookById(currentBook.id);
if(!book)return;
book.position=currentWordPage;
book.totalPages=totalWordPages;
book.lastOpened=Date.now();
try{
await saveBooks();
await saveData(LAST_BOOK_KEY,currentBook.id);
}catch(error){
console.error("Could not save reading position:",error);
}
}

async function loadSettings(){
const stored=await getData(SETTINGS_KEY);
if(stored&&typeof stored==="object"){
if(typeof stored.font==="string")settings.font=stored.font;
if(Number.isFinite(stored.size))settings.size=stored.size;
}
applySettings();
}

async function saveSettings(){
try{
await saveData(SETTINGS_KEY,settings);
}catch(error){console.error("Could not save settings:",error)}
}

function applySettings(){
textElement.style.fontFamily=settings.font;
textElement.style.fontSize=settings.size+"px";
document.querySelectorAll("[data-font]").forEach(button=>{
button.classList.toggle("active",button.dataset.font===settings.font);
});
document.querySelectorAll("[data-size]").forEach(button=>{
button.classList.toggle("active",Number(button.dataset.size)===Number(settings.size));
});
}

async function selectFont(font){
settings.font=font;
applySettings();
await saveSettings();
}

async function selectFontSize(size){
settings.size=Number(size);
applySettings();
await saveSettings();
}

async function openBook(book){
try{
showLoading("Opening book...");
currentBook=book;
currentWordPage=Number(book.position)||0;
const epub=new EPUBBook(book.data);
epub.name=book.name;
await epub.open();
currentBook.epub=epub;
showLoading("Preparing book...");
const completeText=await loadBookText(epub);
words=splitWords(completeText);
totalWordPages=Math.ceil(words.length/WORDS_PER_PAGE);
currentWordPage=Math.max(0,Math.min(currentWordPage,Math.max(0,totalWordPages-1)));
book.totalPages=totalWordPages;
book.position=currentWordPage;
book.lastOpened=Date.now();
await saveBooks();
await saveData(LAST_BOOK_KEY,book.id);
emptyElement.style.display="none";
showWordPage();
hideLoading();
renderLibrary();
}catch(error){
console.error(error);
showError("Could not open book: "+error.message);
hideLoading();
}
}

function createBookId(){
return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2);
}

async function addBooks(files){
if(!files||!files.length)return;
try{
showLoading("Adding books...");
for(let i=0;i<files.length;i++){
const file=files[i];
if(!file.name.toLowerCase().endsWith(".epub"))continue;
showLoading("Reading "+(i+1)+" of "+files.length+"...");
const buffer=await file.arrayBuffer();
const testBook=new EPUBBook(buffer);
await testBook.open();
const existing=books.find(book=>book.name===file.name&&book.size===file.size);
if(existing){
existing.data=buffer;
existing.updated=Date.now();
}else{
books.push({
id:createBookId(),
name:file.name,
data:buffer,
size:file.size,
position:0,
totalPages:0,
saved:Date.now(),
lastOpened:0
});
}
}
await saveBooks();
const lastBook=books[books.length-1];
if(lastBook)await openBook(lastBook);
await renderLibrary();
}catch(error){
console.error(error);
showError("Could not add book: "+error.message);
hideLoading();
}
}

async function deleteBook(id){
const book=getBookById(id);
if(!book)return;
if(!confirm("Delete \""+book.name+"\" from this device?"))return;
try{
books=books.filter(item=>item.id!==id);
await saveBooks();
const lastBookId=await getData(LAST_BOOK_KEY);
if(lastBookId===id){
const replacement=books.slice().sort((a,b)=>(b.lastOpened||0)-(a.lastOpened||0))[0];
if(replacement)await saveData(LAST_BOOK_KEY,replacement.id);
else await saveData(LAST_BOOK_KEY,null);
}
if(currentBook&&currentBook.id===id){
currentBook=null;
words=[];
currentWordPage=0;
totalWordPages=0;
textElement.textContent="";
titleElement.textContent="No book loaded";
chapterInfoElement.textContent="";
emptyElement.style.display="flex";
}
await renderLibrary();
}catch(error){
showError("Could not delete book: "+error.message);
}
}

async function renderLibrary(){
try{
bookListElement.innerHTML="";
if(!books.length){
bookListElement.innerHTML='<div id="emptyLibrary">No books saved.<br><br>Add one or more EPUB files to begin.</div>';
return;
}
const sorted=books.slice().sort((a,b)=>(b.lastOpened||b.saved||0)-(a.lastOpened||a.saved||0));
for(const book of sorted){
const card=document.createElement("div");
card.className="book"+(currentBook&&currentBook.id===book.id?" active":"");
const title=document.createElement("div");
title.className="bookTitle";
title.textContent=book.name;
const info=document.createElement("div");
info.className="bookInfo";
const progress=book.totalPages>0?Math.round(((book.position||0)/(Math.max(1,book.totalPages-1)))*100):0;
info.textContent=book.totalPages>0?progress+"% read":"Not started";
const progressTrack=document.createElement("div");
progressTrack.className="bookProgress";
const progressBar=document.createElement("div");
progressBar.className="bookProgressBar";
progressBar.style.width=Math.max(0,Math.min(100,progress))+"%";
progressTrack.appendChild(progressBar);
const deleteButton=document.createElement("button");
deleteButton.className="deleteBook";
deleteButton.textContent="×";
deleteButton.title="Delete book";
deleteButton.addEventListener("click",event=>{
event.stopPropagation();
deleteBook(book.id);
});
card.appendChild(title);
card.appendChild(info);
card.appendChild(progressTrack);
card.appendChild(deleteButton);
card.addEventListener("click",async()=>{
libraryElement.classList.remove("open");
await openBook(book);
});
bookListElement.appendChild(card);
}
}catch(error){
showError("Could not load library: "+error.message);
}
}

function showLoading(message){
loadingElement.textContent=message;
loadingElement.style.display="flex";
}

function hideLoading(){
loadingElement.style.display="none";
}

function showError(message){
console.error(message);
errorElement.textContent=message;
errorElement.style.display="block";
setTimeout(()=>errorElement.style.display="none",7000);
}

document.getElementById("addButton").addEventListener("click",()=>fileInput.click());

fileInput.addEventListener("change",async event=>{
const files=Array.from(event.target.files||[]);
if(files.length)await addBooks(files);
fileInput.value="";
});

gotoButton.addEventListener("click",goToPercentage);

gotoInput.addEventListener("keydown",event=>{
if(event.key==="Enter")goToPercentage();
});

settingsButton.addEventListener("click",event=>{
event.stopPropagation();
settingsElement.classList.toggle("open");
});

settingsElement.addEventListener("click",event=>event.stopPropagation());

document.addEventListener("click",()=>{
settingsElement.classList.remove("open");
});

document.querySelectorAll("[data-font]").forEach(button=>{
button.addEventListener("click",()=>selectFont(button.dataset.font));
});

document.querySelectorAll("[data-size]").forEach(button=>{
button.addEventListener("click",()=>selectFontSize(button.dataset.size));
});

wordPageElement.addEventListener("click",event=>{
if(Math.abs(touchStartX-event.clientX)>20)return;
if(!words.length)return;
const width=wordPageElement.getBoundingClientRect().width;
if(event.clientX<width/2)previousWords();
else nextWords();
});

wordPageElement.addEventListener("touchstart",event=>{
const touch=event.changedTouches[0];
touchStartX=touch.clientX;
touchStartY=touch.clientY;
},{passive:true});

wordPageElement.addEventListener("touchend",event=>{
const touch=event.changedTouches[0];
const deltaX=touch.clientX-touchStartX;
const deltaY=touch.clientY-touchStartY;
if(Math.abs(deltaX)<40)return;
if(Math.abs(deltaX)<Math.abs(deltaY))return;
if(deltaX<0)nextWords();
else previousWords();
},{passive:true});

document.addEventListener("keydown",event=>{
if(event.target===gotoInput)return;
if(event.key==="ArrowRight")nextWords();
if(event.key==="ArrowLeft")previousWords();
});

document.getElementById("libraryButton").addEventListener("click",async()=>{
libraryElement.classList.add("open");
await renderLibrary();
});

document.getElementById("closeLibrary").addEventListener("click",()=>{
libraryElement.classList.remove("open");
});

async function start(){
try{
await openDB();
await requestPersistentStorage();
const storedBooks=await getData(BOOKS_KEY);
books=Array.isArray(storedBooks)?storedBooks:[];
await loadSettings();
const lastBookId=await getData(LAST_BOOK_KEY);
let book=null;
if(lastBookId)book=getBookById(lastBookId);
if(!book&&books.length)book=books.slice().sort((a,b)=>(b.lastOpened||0)-(a.lastOpened||0))[0];
if(book){
await openBook(book);
}else{
hideLoading();
emptyElement.style.display="flex";
await renderLibrary();
}
}catch(error){
console.error(error);
showError("Startup error: "+error.message);
hideLoading();
}
}

start();
</script>
</body>
</html>

<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<meta
  name="theme-color"
  content="#121212"
>

<title>Offline EPUB Reader</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
}


html,
body {

  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #121212;

  color: #eeeeee;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

}


/* =========================================================
   APP
========================================================= */

#app {

  width: 100%;
  height: 100%;

  display: flex;

  flex-direction: column;

}


/* =========================================================
   TOOLBAR
========================================================= */

#toolbar {

  height: 58px;

  min-height: 58px;

  display: flex;

  align-items: center;

  gap: 8px;

  padding: 8px 12px;

  background: #1b1b1b;

  border-bottom: 1px solid #333;

}


button {

  border: 0;

  border-radius: 7px;

  padding: 9px 13px;

  background: #303030;

  color: #eeeeee;

  font: inherit;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;

}


button:hover {

  background: #404040;

}


button:active {

  background: #4b4b4b;

}


#addButton {

  background: #1769aa;

}


#addButton:hover {

  background: #1d7fc7;

}


#fileInput {

  display: none;

}


#title {

  flex: 1;

  min-width: 0;

  text-align: center;

  font-size: 15px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

  color: #ddd;

}


/* =========================================================
   READER
========================================================= */

#reader {

  position: relative;

  flex: 1;

  min-height: 0;

  width: 100%;

  overflow: hidden;

  background: #121212;

}


#wordPage {

  width: 100%;

  height: 100%;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 35px;

  overflow: hidden;

  cursor: pointer;

  user-select: none;

  -webkit-user-select: none;

  touch-action: pan-y;

  -webkit-tap-highlight-color: transparent;

}


/* =========================================================
   TEXT
========================================================= */

#text {

  width: 100%;

  max-width: 850px;

  max-height: 100%;

  overflow: hidden;

  color: #eeeeee;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 22px;

  line-height: 1.8;

  text-align: justify;

  text-justify: inter-word;

  overflow-wrap: break-word;

}


/* =========================================================
   EMPTY
========================================================= */

#empty {

  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  text-align: center;

  padding: 30px;

  color: #888;

  font-size: 17px;

  line-height: 1.7;

}


#empty strong {

  color: #ddd;

}


/* =========================================================
   CHAPTER INFO
========================================================= */

#chapterInfo {

  position: absolute;

  left: 0;

  right: 0;

  bottom: 12px;

  text-align: center;

  pointer-events: none;

  color: #666;

  font-size: 12px;

}


/* =========================================================
   STORAGE STATUS
========================================================= */

#storageStatus {

  position: fixed;

  right: 10px;

  bottom: 10px;

  z-index: 80;

  padding: 5px 9px;

  border-radius: 6px;

  font-size: 10px;

  background: #222;

  color: #888;

  pointer-events: none;

}


#storageStatus.persistent {

  color: #65d879;

}


#storageStatus.temporary {

  color: #e9b84b;

}


#storageStatus.unsupported {

  color: #999;

}


/* =========================================================
   LIBRARY
========================================================= */

#library {

  position: fixed;

  left: 0;

  top: 0;

  bottom: 0;

  width: 330px;

  max-width: 90vw;

  background: #1d1d1d;

  z-index: 50;

  transform: translateX(-100%);

  transition:
    transform .2s ease;

  box-shadow:
    8px 0 30px #0009;

  display: flex;

  flex-direction: column;

}


#library.open {

  transform: translateX(0);

}


#libraryHeader {

  height: 58px;

  min-height: 58px;

  display: flex;

  align-items: center;

  gap: 10px;

  padding: 10px 12px;

  border-bottom: 1px solid #333;

}


#libraryHeader h2 {

  margin: 0;

  flex: 1;

  font-size: 18px;

}


#bookList {

  flex: 1;

  overflow-y: auto;

  padding: 10px;

}


.book {

  position: relative;

  padding: 14px;

  margin-bottom: 9px;

  background: #2a2a2a;

  border-radius: 8px;

  cursor: pointer;

}


.book:hover {

  background: #353535;

}


.bookTitle {

  font-weight: 600;

  padding-right: 30px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}


.bookInfo {

  margin-top: 5px;

  color: #888;

  font-size: 12px;

}


.deleteBook {

  position: absolute;

  right: 7px;

  top: 7px;

  padding: 3px 8px;

  background: transparent;

  color: #888;

}


.deleteBook:hover {

  color: #ff6666;

  background: #444;

}


/* =========================================================
   EMPTY LIBRARY
========================================================= */

#emptyLibrary {

  color: #888;

  text-align: center;

  padding: 30px 15px;

  line-height: 1.6;

}


/* =========================================================
   LOADING
========================================================= */

#loading {

  position: absolute;

  inset: 0;

  z-index: 20;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #121212;

  color: #aaa;

}


/* =========================================================
   ERROR
========================================================= */

#error {

  position: fixed;

  left: 15px;

  right: 15px;

  bottom: 20px;

  z-index: 100;

  padding: 12px 15px;

  background: #9d2020;

  color: white;

  border-radius: 8px;

  display: none;

  white-space: pre-wrap;

  line-height: 1.5;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

  #toolbar {

    height: 54px;

    min-height: 54px;

    padding: 7px;

    gap: 5px;

  button {

    padding: 8px 10px;

  }


  #title {

    font-size: 13px;

  }


  #wordPage {

    padding: 22px 18px 40px;

  }


  #text {

    font-size: 20px;

    line-height: 1.75;

  }

/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media (max-width: 380px) {

  #libraryButton {

    font-size: 0;

    content: "☰";

  }

  }


  #addButton::before {

    content: "+";

    font-size: 20px;

  }


  #text {

  }

}

<body>


<div id="app">


  <!-- =====================================================
       TOOLBAR
  ====================================================== -->

</div>


<!-- =======================================================
     LIBRARY
======================================================= -->

<div id="library">


  <div id="libraryHeader">

    <h2>

    </h2>

      ×

    </button>

<!-- =======================================================
     STORAGE STATUS
======================================================= -->

<div id="storageStatus">

  Checking storage...

</div>


<!-- =======================================================
     ERROR
======================================================= -->

<div id="error"></div>


<script>

"use strict";


/* =========================================================
   SETTINGS
========================================================= */

const WORDS_PER_PAGE = 20;


/*
 * Database name.
 *
 * This is intentionally different from the previous version.
 *
 * This prevents an old/broken database from interfering with
 * this new storage implementation.
 */

const DB_NAME =
  "OfflineEPUBReaderPersistent";


const DB_VERSION = 1;


const STORE_NAME =
  "books";


const BOOK_KEY =
  "current-book";


const POSITION_KEY =
  "reading-position";


/* =========================================================
   STATE
========================================================= */

let db = null;

let currentBook = null;

let words = [];

let currentWordPage = 0;

let totalWordPages = 0;

let touchStartX = 0;

let touchStartY = 0;


/* =========================================================
   DOM
========================================================= */

const textElement =
  document.getElementById(
    "text"
  );


const wordPageElement =
  document.getElementById(
    "wordPage"
  );


const emptyElement =
  document.getElementById(
    "empty"
  );


const loadingElement =
  document.getElementById(
    "loading"
  );


const titleElement =
  document.getElementById(
    "title"
  );


const chapterInfoElement =
  document.getElementById(
    "chapterInfo"
  );


const fileInput =
  document.getElementById(
    "fileInput"
  );


const libraryElement =
  document.getElementById(
    "library"
  );


const bookListElement =
  document.getElementById(
    "bookList"
  );


const errorElement =
  document.getElementById(
    "error"
  );


const storageStatusElement =
  document.getElementById(
    "storageStatus"
  );


/* =========================================================
   STORAGE PERSISTENCE
========================================================= */


/*
 * Ask the browser for persistent storage.
 *
 * On supported browsers this tells the browser that the
 * application's IndexedDB data should not be automatically
 * removed as ordinary temporary website data.
 */

async function requestPersistentStorage() {

  try {

    if (
      !navigator.storage
    ) {

      storageStatusElement.textContent =
        "Storage API unavailable";

      storageStatusElement.className =
        "unsupported";

      return false;

    }


    if (
      !navigator.storage.persist
    ) {

      storageStatusElement.textContent =
        "Persistent storage unavailable";

      storageStatusElement.className =
        "temporary";

      return false;

    }


    let persisted =
      false;


    if (
      navigator.storage.persisted
    ) {

      try {

        persisted =
          await navigator.storage.persisted();

      }
      catch {

        persisted =
          false;

      }

    }


    /*
     * If storage isn't persistent yet, request it.
     */

    if (!persisted) {

      try {

        persisted =
          await navigator.storage.persist();

      }
      catch {

        persisted =
          false;

      }

    }


    if (persisted) {

      storageStatusElement.textContent =
        "● Persistent storage";

      storageStatusElement.className =
        "persistent";

      return true;

    }


    storageStatusElement.textContent =
      "● Device storage";

    storageStatusElement.className =
      "temporary";

    return false;

  }
  catch (error) {

    console.warn(
      "Persistent storage check failed:",
      error
    );


    storageStatusElement.textContent =
      "● Device storage";

    storageStatusElement.className =
      "temporary";

    return false;

  }

}


/* =========================================================
   STORAGE ESTIMATE
========================================================= */

async function checkStorageSpace() {

  try {

    if (
      !navigator.storage ||
      !navigator.storage.estimate
    ) {

      return;

    }


    const estimate =
      await navigator.storage.estimate();


    if (
      typeof estimate.quota ===
      "number"
    ) {

      console.log(
        "Storage quota:",
        estimate.quota
      );

    }


    if (
      typeof estimate.usage ===
      "number"
    ) {

      console.log(
        "Storage currently used:",
        estimate.usage
      );

    }

  }
  catch (error) {

    console.warn(
      "Could not check storage:",
      error
    );

  }

}


/* =========================================================
   INDEXED DB OPEN
========================================================= */

function openDB() {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      if (
        !window.indexedDB
      ) {

        reject(
          new Error(
            "IndexedDB is not available in this browser."
          )
        );

        return;

      }


      let request;


      try {

        request =
          indexedDB.open(
            DB_NAME,
            DB_VERSION
          );

      }
      catch (error) {

        reject(error);

        return;

      }


      request.onupgradeneeded =
        event => {

          const database =
            event.target.result;


          /*
           * Create the books store.
           */

          if (
            !database.objectStoreNames.contains(
              STORE_NAME
            )
          ) {

            database.createObjectStore(
              STORE_NAME
            );

          }

        };


      request.onsuccess =
        event => {

          const database =
            event.target.result;


          /*
           * Make sure the required store exists.
           */

          if (
            !database.objectStoreNames.contains(
              STORE_NAME
            )
          ) {

            database.close();


            reject(
              new Error(
                "IndexedDB opened but the books object store is missing."
              )
            );

            return;

          }


          db =
            database;


          /*
           * If another tab changes the DB version,
           * close this connection.
           */

          database.onversionchange =
            () => {

              database.close();

            };


          resolve(
            database
          );

        };


      request.onerror =
        () => {

          reject(
            request.error ||
            new Error(
              "Could not open IndexedDB."
            )
          );

        };


      request.onblocked =
        () => {

          reject(
            new Error(
              "IndexedDB is blocked by another open page. Close other tabs/windows running this reader and reload."
            )
          );

        };

    }
  );

}


/* =========================================================
   DATABASE CHECK
========================================================= */

function ensureDatabase() {

  if (!db) {

    throw new Error(
      "Database has not been opened."
    );

  }


  if (
    !db.objectStoreNames.contains(
      STORE_NAME
    )
  ) {

    throw new Error(
      "Required IndexedDB object store is missing."
    );

  }

}


/* =========================================================
   SAVE TO INDEXED DB
========================================================= */

function saveData(
  key,
  value
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      try {

        ensureDatabase();


        const transaction =
          db.transaction(
            STORE_NAME,
            "readwrite"
          );


        const store =
          transaction.objectStore(
            STORE_NAME
          );


        store.put(
          value,
          key
        );


        transaction.oncomplete =
          () => {

            resolve();

          };


        transaction.onerror =
          () => {

            reject(
              transaction.error ||
              new Error(
                "IndexedDB save failed."
              )
            );

          };


        transaction.onabort =
          () => {

            reject(
              transaction.error ||
              new Error(
                "IndexedDB save was aborted."
              )
            );

          };

      }
      catch (error) {

        reject(error);

      }

    }
  );

}


/* =========================================================
   GET FROM INDEXED DB
========================================================= */

function getData(
  key
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      try {

        ensureDatabase();


        const transaction =
          db.transaction(
            STORE_NAME,
            "readonly"
          );


        const store =
          transaction.objectStore(
            STORE_NAME
          );


        const request =
          store.get(
            key
          );


        request.onsuccess =
          () => {

            resolve(
              request.result
            );

          };


        request.onerror =
          () => {

            reject(
              request.error ||
              new Error(
                "IndexedDB read failed."
              )
            );

          };


        transaction.onerror =
          () => {

            reject(
              transaction.error ||
              new Error(
                "IndexedDB read transaction failed."
              )
            );

          };

      }
      catch (error) {

        reject(error);

      }

    }
  );

}


/* =========================================================
   DELETE FROM INDEXED DB
========================================================= */

function deleteData(
  key
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      try {

        ensureDatabase();


        const transaction =
          db.transaction(
            STORE_NAME,
            "readwrite"
          );


        const store =
          transaction.objectStore(
            STORE_NAME
          );


        store.delete(
          key
        );


        transaction.oncomplete =
          () => {

            resolve();

          };


        transaction.onerror =
          () => {

            reject(
              transaction.error ||
              new Error(
                "IndexedDB delete failed."
              )
            );

          };


        transaction.onabort =
          () => {

            reject(
              transaction.error ||
              new Error(
                "IndexedDB delete was aborted."
              )
            );

          };

      }
      catch (error) {

        reject(error);

      }

    }
  );

}


/* =========================================================
   SAVE BOOK
========================================================= */


/*
 * Store the EPUB as a Blob.
 *
 * Blob is deliberately used instead of relying only on a
 * JavaScript ArrayBuffer object.
 */

async function saveBook(
  file
) {

  const blob =
    new Blob(
      [
        await file.arrayBuffer()
      ],
      {
        type:
          "application/epub+zip"
      }
    );


  const bookRecord = {

    id:
      BOOK_KEY,

    name:
      file.name,

    size:
      file.size,

    type:
      file.type ||
      "application/epub+zip",

    saved:
      Date.now(),

    data:
      blob

  };


  await saveData(
    BOOK_KEY,
    bookRecord
  );


  /*
   * Verify immediately after saving.
   *
   * This is important on mobile because it confirms that
   * IndexedDB actually contains the EPUB before the app
   * continues.
   */

  const verification =
    await getData(
      BOOK_KEY
    );


  if (
    !verification ||
    !verification.data
  ) {

    throw new Error(
      "The EPUB could not be verified after saving."
    );

  }


  return verification;

}


/* =========================================================
   READ STORED BOOK
========================================================= */

async function getSavedBook() {

  const stored =
    await getData(
      BOOK_KEY
    );


  if (
    !stored
  ) {

    return null;

  }


  if (
    !stored.data
  ) {

    console.warn(
      "Stored book exists but EPUB data is missing."
    );


    return null;

  }


  return stored;

}


/* =========================================================
   ZIP HELPERS
========================================================= */

function u16(
  array,
  offset
) {

  return (
    array[offset] |
    (
      array[offset + 1] << 8
    )
  );

}


function u32(
  array,
  offset
) {

  return (
    array[offset] |
    (
      array[offset + 1] << 8
    ) |
    (
      array[offset + 2] << 16
    ) |
    (
      array[offset + 3] << 24
    )
  ) >>> 0;

}


function decodeText(
  bytes
) {

  return new TextDecoder(
    "utf-8"
  ).decode(
    bytes
  );

}


/* =========================================================
   DEFLATE
========================================================= */

async function inflateRaw(
  data
) {

  if (
    typeof DecompressionStream ===
    "undefined"
  ) {

    throw new Error(
      "This browser does not support ZIP decompression."
    );

  }


  const stream =
    new Blob(
      [data]
    )
      .stream()
      .pipeThrough(
        new DecompressionStream(
          "deflate-raw"
        )
      );


  return new Uint8Array(
    await new Response(
      stream
    ).arrayBuffer()
  );

}


/* =========================================================
   ZIP READER
========================================================= */

class ZipReader {


  constructor(
    buffer
  ) {

    this.data =
      new Uint8Array(
        buffer
      );


    this.files =
      new Map();


    this.readDirectory();

  }


  readDirectory() {

    const a =
      this.data;


    let eocd =
      -1;


    /*
     * Find End Of Central Directory.
     */

    for (
      let i =
        a.length - 22;

      i >=
        Math.max(
          0,
          a.length - 66000
        );

      i--
    ) {

      if (

        a[i] === 0x50 &&

        a[i + 1] === 0x4b &&

        a[i + 2] === 0x05 &&

        a[i + 3] === 0x06

      ) {

        eocd =
          i;

        break;

      }

    }


    if (
      eocd < 0
    ) {

      throw new Error(
        "Invalid EPUB ZIP structure."
      );

    }


    const count =
      u16(
        a,
        eocd + 10
      );


    const offset =
      u32(
        a,
        eocd + 16
      );


    let position =
      offset;


    for (
      let i = 0;
      i < count;
      i++
    ) {


      if (

        a[position] !== 0x50 ||

        a[position + 1] !== 0x4b ||

        a[position + 2] !== 0x01 ||

        a[position + 3] !== 0x02

      ) {

        throw new Error(
          "Invalid ZIP central directory."
        );

      }


      const method =
        u16(
          a,
          position + 10
        );


      const compressedSize =
        u32(
          a,
          position + 20
        );


      const nameLength =
        u16(
          a,
          position + 28
        );


      const extraLength =
        u16(
          a,
          position + 30
        );


      const commentLength =
        u16(
          a,
          position + 32
        );


      const localOffset =
        u32(
          a,
          position + 42
        );


      const name =
        decodeText(
          a.slice(
            position + 46,
            position +
              46 +
              nameLength
          )
        );


      this.files.set(
        name,
        {

          method,

          compressedSize,

          localOffset

        }
      );


      position +=
        46 +
        nameLength +
        extraLength +
        commentLength;

    }

  }


  has(
    name
  ) {

    return this.files.has(
      name.replace(
        /^\/+/,
        ""
      )
    );

  }


  async get(
    name
  ) {

    name =
      name.replace(
        /^\/+/,
        ""
      );


    const info =
      this.files.get(
        name
      );


    if (!info) {

      throw new Error(
        "File not found: " +
        name
      );

    }


    const a =
      this.data;


    const position =
      info.localOffset;


    const nameLength =
      u16(
        a,
        position + 26
      );


    const extraLength =
      u16(
        a,
        position + 28
      );


    const start =
      position +
      30 +
      nameLength +
      extraLength;


    const compressed =
      a.slice(
        start,
        start +
          info.compressedSize
      );


    /*
     * No compression.
     */

    if (
      info.method === 0
    ) {

      return compressed;

    }


    /*
     * Deflate.
     */

    if (
      info.method === 8
    ) {

      return inflateRaw(
        compressed
      );

    }


    throw new Error(
      "Unsupported ZIP compression method: " +
      info.method
    );

  }

}


/* =========================================================
   PATH HELPERS
========================================================= */

function normalizePath(
  path
) {

  const parts =
    [];


  for (
    const part of
    path.split("/")
  ) {

    if (
      !part ||
      part === "."
    ) {

      continue;

    }


    if (
      part === ".."
    ) {

      parts.pop();

    }
    else {

      parts.push(
        part
      );

    }

  }


  return parts.join(
    "/"
  );

}


function dirname(
  path
) {

  const index =
    path.lastIndexOf(
      "/"
    );


  if (
    index < 0
  ) {

    return "";

  }


  return path.slice(
    0,
    index
  );

}


function resolvePath(
  base,
  relative
) {

  if (
    relative.startsWith(
      "/"
    )
  ) {

    return normalizePath(
      relative
    );

  }


  return normalizePath(

    base
      ? base +
        "/" +
        relative
      : relative

  );

}


/* =========================================================
   EPUB BOOK
========================================================= */

class EPUBBook {


  constructor(
    buffer
  ) {

    this.zip =
      new ZipReader(
        buffer
      );


    this.basePath =
      "";


    this.manifest =
      new Map();


    this.chapters =
      [];

  }


  async open() {


    /*
     * Verify mimetype.
     */

    if (
      !this.zip.has(
        "mimetype"
      )
    ) {

      throw new Error(
        "This file is not a valid EPUB."
      );

    }


    /*
     * Read container.xml.
     */

    const container =
      new DOMParser()
        .parseFromString(

          decodeText(
            await this.zip.get(
              "META-INF/container.xml"
            )
          ),

          "application/xml"

        );


    const rootfile =
      container.querySelector(
        "rootfile"
      );


    if (!rootfile) {

      throw new Error(
        "EPUB package file not found."
      );

    }


    const opfPath =
      rootfile.getAttribute(
        "full-path"
      );


    if (!opfPath) {

      throw new Error(
        "EPUB package path is missing."
      );

    }


    this.basePath =
      dirname(
        opfPath
      );


    /*
     * Read OPF.
     */

    const opf =
      new DOMParser()
        .parseFromString(

          decodeText(
            await this.zip.get(
              opfPath
            )
          ),

          "application/xml"

        );


    /*
     * Manifest.
     */

    for (
      const item of
      opf.querySelectorAll(
        "manifest > item"
      )
    ) {

      const id =
        item.getAttribute(
          "id"
        );


      const href =
        item.getAttribute(
          "href"
        );


      if (
        !id ||
        !href
      ) {

        continue;

      }


      this.manifest.set(
        id,
        {

          href,

          mediaType:
            item.getAttribute(
              "media-type"
            ),

          properties:
            item.getAttribute(
              "properties"
            ) ||
            ""

        }
      );

    }


    /*
     * Spine.
     */

    const spine =
      opf.querySelector(
        "spine"
      );


    if (!spine) {

      throw new Error(
        "EPUB has no spine."
      );

    }


    for (
      const ref of
      spine.querySelectorAll(
        "itemref"
      )
    ) {

      const id =
        ref.getAttribute(
          "idref"
        );


      const item =
        this.manifest.get(
          id
        );


      if (!item) {

        continue;

      }


      let href =
        item.href
          .split("#")[0];


      try {

        href =
          decodeURIComponent(
            href
          );

      }
      catch {

        /* Keep original href. */

      }


      this.chapters.push({

        id,

        path:
          resolvePath(
            this.basePath,
            href
          ),

        title:
          "Chapter " +
          (
            this.chapters.length +
            1
          )

      });

    }


    /*
     * Read navigation.
     */

    await this.loadNavigation(
      opf
    );


    if (
      !this.chapters.length
    ) {

      throw new Error(
        "No readable chapters found."
      );

    }

  }


  async loadNavigation(
    opf
  ) {


    /*
     * EPUB 3.
     */

    for (
      const item of
      this.manifest.values()
    ) {

      if (
        item.properties
          .split(/\s+/)
          .includes(
            "nav"
          )
      ) {


        let href =
          item.href;


        try {

          href =
            decodeURIComponent(
              href
            );

        }
        catch {

          /* Keep original. */

        }


        const path =
          resolvePath(
            this.basePath,
            href
          );


        await this.parseNavigation(
          path
        );


        return;

      }

    }


    /*
     * EPUB 2 NCX.
     */

    const spine =
      opf.querySelector(
        "spine"
      );


    if (!spine) {

      return;

    }


    const tocId =
      spine.getAttribute(
        "toc"
      );


    if (
      !tocId ||
      !this.manifest.has(
        tocId
      )
    ) {

      return;

    }


    const item =
      this.manifest.get(
        tocId
      );


    let href =
      item.href;


    try {

      href =
        decodeURIComponent(
          href
        );

    }
    catch {

      /* Keep original. */

    }


    const path =
      resolvePath(
        this.basePath,
        href
      );


    await this.parseNCX(
      path
    );

  }


  async parseNCX(
    path
  ) {

    try {

      const doc =
        new DOMParser()
          .parseFromString(

            decodeText(
              await this.zip.get(
                path
              )
            ),

            "application/xml"

          );


      for (
        const point of
        doc.querySelectorAll(
          "navPoint"
        )
      ) {


        const label =
          point.querySelector(
            "navLabel text"
          );


        const content =
          point.querySelector(
            "content"
          );


        if (
          !label ||
          !content
        ) {

          continue;

        }


        const src =
          content.getAttribute(
            "src"
          );


        if (!src) {

          continue;

        }


        let targetPath =
          src.split("#")[0];


        try {

          targetPath =
            decodeURIComponent(
              targetPath
            );

        }
        catch {

          /* Keep original. */

        }


        const target =
          resolvePath(
            dirname(path),
            targetPath
          );


        const index =
          this.chapters.findIndex(
            chapter =>
              chapter.path ===
              target
          );


        if (
          index >= 0
        ) {

          const title =
            label.textContent.trim();


          if (title) {

            this.chapters[index]
              .title =
              title;

          }

        }

      }

    }
    catch (error) {

      console.warn(
        "Could not read NCX:",
        error
      );

    }

  }


  async parseNavigation(
    path
  ) {

    try {

      const doc =
        new DOMParser()
          .parseFromString(

            decodeText(
              await this.zip.get(
                path
              )
            ),

            "application/xhtml+xml"

          );


      const links =
        doc.querySelectorAll(
          "nav a"
        );


      for (
        const link of
        links
      ) {


        const href =
          link.getAttribute(
            "href"
          );


        if (!href) {

          continue;

        }


        let targetPath =
          href.split("#")[0];


        try {

          targetPath =
            decodeURIComponent(
              targetPath
            );

        }
        catch {

          /* Keep original. */

        }


        const target =
          resolvePath(
            dirname(path),
            targetPath
          );


        const index =
          this.chapters.findIndex(
            chapter =>
              chapter.path ===
              target
          );


        if (
          index >= 0
        ) {

          const title =
            link.textContent.trim();


          if (title) {

            this.chapters[index]
              .title =
              title;

          }

        }

      }

    }
    catch (error) {

      console.warn(
        "Could not read navigation:",
        error
      );

    }

  }


  async getChapter(
    index
  ) {

    const chapter =
      this.chapters[index];


    if (!chapter) {

      return null;

    }


    const bytes =
      await this.zip.get(
        chapter.path
      );


    return {

      index,

      path:
        chapter.path,

      title:
        chapter.title,

      html:
        decodeText(
          bytes
        )

    };

  }

}


/* =========================================================
   EXTRACT CHAPTER TEXT
========================================================= */

async function extractChapterText(
  chapter
) {

  const parser =
    new DOMParser();


  const document =
    parser.parseFromString(
      chapter.html,
      "text/html"
    );


  document
    .querySelectorAll(
      "script,style,noscript,iframe,object,embed"
    )
    .forEach(
      element =>
        element.remove()
    );


  let result =
    document.body
      ? document.body.innerText
      : document.documentElement.innerText;


  result =
    result
      .replace(
        /\u00a0/g,
        " "
      )
      .replace(
        /\s+/g,
        " "
      )
      .trim();


  return result;

}


/* =========================================================
   LOAD COMPLETE BOOK TEXT
========================================================= */

async function loadBookText(
  book
) {

  const result =
    [];


  for (
    let i = 0;
    i < book.chapters.length;
    i++
  ) {


    const chapter =
      await book.getChapter(
        i
      );


    if (!chapter) {

      continue;

    }


    const chapterText =
      await extractChapterText(
        chapter
      );


    if (!chapterText) {

      continue;

    }


    result.push(
      chapterText
    );

  }


  return result.join(
    " "
  );

}


/* =========================================================
   WORD SPLITTER
========================================================= */

function splitWords(
  text
) {

  if (!text) {

    return [];

  }


  return text
    .trim()
    .split(/\s+/)
    .filter(
      word =>
        word.length > 0
    );

}


/* =========================================================
   DISPLAY PAGE
========================================================= */

function showWordPage() {


  if (!words.length) {

    textElement.textContent =
      "This book contains no readable text.";


    chapterInfoElement.textContent =
      "";


    return;

  }


  const start =
    currentWordPage *
    WORDS_PER_PAGE;


  const end =
    Math.min(
      start +
        WORDS_PER_PAGE,
      words.length
    );


  const pageWords =
    words.slice(
      start,
      end
    );


  textElement.textContent =
    pageWords.join(
      " "
    );


  totalWordPages =
    Math.ceil(
      words.length /
      WORDS_PER_PAGE
    );


  chapterInfoElement.textContent =

    (
      currentWordPage +
      1
    ) +

    " / " +

    totalWordPages;


  if (
    currentBook
  ) {

    titleElement.textContent =
      currentBook.name;

  }


  savePosition();

}


/* =========================================================
   NEXT
========================================================= */

function nextWords() {


  if (!words.length) {

    return;

  }


  if (
    currentWordPage <
    totalWordPages - 1
  ) {

    currentWordPage++;


    showWordPage();

  }

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousWords() {


  if (!words.length) {

    return;

  }


  if (
    currentWordPage > 0
  ) {

    currentWordPage--;


    showWordPage();

  }

}


/* =========================================================
   SAVE READING POSITION
========================================================= */

function savePosition() {


  if (!currentBook) {

    return;

  }


  saveData(
    POSITION_KEY,
    {

      page:
        currentWordPage,

      saved:
        Date.now()

    }
  )
  .catch(
    error => {

      console.warn(
        "Could not save reading position:",
        error
      );

    }
  );

}


/* =========================================================
   RESTORE READING POSITION
========================================================= */

async function restorePosition() {


  const position =
    await getData(
      POSITION_KEY
    );


  if (!position) {

    currentWordPage =
      0;

    return;

  }


  const page =
    Number.isFinite(
      position.page
    )
      ? position.page
      : 0;


  currentWordPage =
    Math.max(

      0,

      Math.min(

        page,

        Math.max(
          0,
          totalWordPages - 1
        )

      )

    );

}


/* =========================================================
   OPEN STORED BOOK
========================================================= */

async function openStoredBook(
  storedBook
) {

  try {

    showLoading(
      "Opening saved book..."
    );


    if (
      !storedBook ||
      !storedBook.data
    ) {

      throw new Error(
        "Saved EPUB data is missing."
      );

    }


    /*
     * Convert the stored Blob back to ArrayBuffer.
     */

    let buffer;


    if (
      storedBook.data instanceof Blob
    ) {

      buffer =
        await storedBook.data.arrayBuffer();

    }
    else if (
      storedBook.data instanceof ArrayBuffer
    ) {

      buffer =
        storedBook.data;

    }
    else {

      throw new Error(
        "Saved EPUB has an unsupported storage format."
      );

    }


    currentBook =
      new EPUBBook(
        buffer
      );


    currentBook.name =
      storedBook.name ||
      "Untitled EPUB";


    await currentBook.open();


    showLoading(
      "Preparing book..."
    );


    const completeText =
      await loadBookText(
        currentBook
      );


    words =
      splitWords(
        completeText
      );


    totalWordPages =
      Math.ceil(
        words.length /
        WORDS_PER_PAGE
      );


    await restorePosition();


    emptyElement.style.display =
      "none";


    showWordPage();


    hideLoading();


    await renderLibrary();

  }
  catch (error) {

    console.error(
      "Could not open stored book:",
      error
    );


    showError(
      "Could not open saved book: " +
      (
        error.message ||
        String(error)
      )
    );


    hideLoading();

  }

}


/* =========================================================
   ADD BOOK
========================================================= */

async function addBook(
  file
) {

  try {


    if (
      !file
    ) {

      return;

    }


    showLoading(
      "Reading EPUB..."
    );


    /*
     * Validate the EPUB before saving.
     */

    const buffer =
      await file.arrayBuffer();


    const testBook =
      new EPUBBook(
        buffer
      );


    await testBook.open();


    showLoading(
      "Saving book to device..."
    );


    /*
     * Save the original EPUB.
     */

    const blob =
      new Blob(
        [buffer],
        {
          type:
            "application/epub+zip"
        }
      );


    const bookRecord = {

      id:
        BOOK_KEY,

      name:
        file.name,

      size:
        file.size,

      type:
        "application/epub+zip",

      saved:
        Date.now(),

      data:
        blob

    };


    await saveData(
      BOOK_KEY,
      bookRecord
    );


    /*
     * Verify that IndexedDB contains the actual book.
     */

    const verification =
      await getData(
        BOOK_KEY
      );


    if (
      !verification ||
      !verification.data
    ) {

      throw new Error(
        "Book storage verification failed."
      );

    }


    /*
     * Verify the stored Blob can be read.
     */

    const storedBuffer =
      await verification.data.arrayBuffer();


    if (
      !storedBuffer ||
      storedBuffer.byteLength === 0
    ) {

      throw new Error(
        "The stored EPUB is empty."
      );

    }


    /*
     * Reset reading position.
     */

    await saveData(
      POSITION_KEY,
      {

        page: 0,

        saved:
          Date.now()

      }
    );


    /*
     * Open the stored copy.
     */

    await openStoredBook(
      verification
    );


    /*
     * Check storage after saving.
     */

    await checkStorageSpace();

  }
  catch (error) {

    console.error(
      "Could not add book:",
      error
    );


    showError(
      "Could not add book: " +
      (
        error.message ||
        String(error)
      )
    );


    hideLoading();

  }

}

/* =========================================================
   CLICK NAVIGATION
========================================================= */

wordPageElement.addEventListener(
  "click",
  event => {


    /*
     * Don't treat swipe movement as click.
     */

    if (
      Math.abs(
        touchStartX -
        event.clientX
      ) > 20
    ) {

      return;

    }


    if (
      !words.length
    ) {

      return;

    }


    const width =
      wordPageElement
        .getBoundingClientRect()
        .width;


    if (
      event.clientX <
      width / 2
    ) {

      previousWords();

    }
    else {

      nextWords();

    }

  }
);


/* =========================================================
   TOUCH START
========================================================= */

wordPageElement.addEventListener(
  "touchstart",
  event => {


    const touch =
      event.changedTouches[0];


    touchStartX =
      touch.clientX;


    touchStartY =
      touch.clientY;


  },
  {
    passive: true
  }
);


/* =========================================================
   TOUCH END
========================================================= */

wordPageElement.addEventListener(
  "touchend",
  event => {


    const touch =
      event.changedTouches[0];


    const endX =
      touch.clientX;


    const endY =
      touch.clientY;


    const deltaX =
      endX -
      touchStartX;


    const deltaY =
      endY -
      touchStartY;


    if (
      Math.abs(deltaX) <
      40
    ) {

      return;

    }


    if (
      Math.abs(deltaX) <
      Math.abs(deltaY)
    ) {

      return;

    }


    /*
     * Swipe LEFT = next.
     */

    if (
      deltaX < 0
    ) {

      nextWords();

    }


    /*
     * Swipe RIGHT = previous.
     */

    else {

      previousWords();

    }

  },
  {
    passive: true
  }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event => {


    if (
      event.key ===
      "ArrowRight"
    ) {

      nextWords();

    }


    if (
      event.key ===
      "ArrowLeft"
    ) {

      previousWords();

    }

  }
);

/* =========================================================
   RENDER LIBRARY
========================================================= */

async function renderLibrary() {


  const book =
    await getSavedBook();


  bookListElement.innerHTML =
    "";


  if (
    !book
  ) {


    bookListElement.innerHTML = `

      <div id="emptyLibrary">

        No book saved.

        <br><br>

        Add an EPUB to begin.

      </div>

    `;


    return;

  }


  const card =
    document.createElement(
      "div"
    );


  card.className =
    "book";


  const title =
    document.createElement(
      "div"
    );


  title.className =
    "bookTitle";


  title.textContent =
    book.name ||
    "Untitled EPUB";


  const info =
    document.createElement(
      "div"
    );


  info.className =
    "bookInfo";


  const sizeMB =
    book.size
      ? (
          book.size /
          1024 /
          1024
        ).toFixed(1)
      : "?";


  info.textContent =
    sizeMB +
    " MB • Saved on this device";


  const deleteButton =
    document.createElement(
      "button"
    );


  deleteButton.className =
    "deleteBook";


  deleteButton.textContent =
    "×";


  deleteButton.title =
    "Delete book";


  deleteButton.addEventListener(
    "click",
    async event => {


      event.stopPropagation();


      if (
        !confirm(
          "Delete this book from this device?"
        )
      ) {

        return;

      }


      try {


        await deleteData(
          BOOK_KEY
        );


        await deleteData(
          POSITION_KEY
        );


        currentBook =
          null;


        words =
          [];


        currentWordPage =
          0;


        totalWordPages =
          0;


        textElement.textContent =
          "";


        titleElement.textContent =
          "No book loaded";


        chapterInfoElement.textContent =
          "";


        emptyElement.style.display =
          "flex";


        await renderLibrary();


      }
      catch (error) {

        console.error(
          error
        );


        showError(
          "Could not delete book: " +
          (
            error.message ||
            String(error)
          )
        );

      }

    }
  );


  card.appendChild(
    title
  );


  card.appendChild(
    info
  );


  card.appendChild(
    deleteButton
  );


  card.addEventListener(
    "click",
    async () => {


      libraryElement
        .classList
        .remove("open");


      try {


        const savedBook =
          await getSavedBook();


        if (
          savedBook
        ) {

          await openStoredBook(
            savedBook
          );

        }

      }
      catch (error) {

        console.error(
          error
        );


        showError(
          "Could not load saved book: " +
          (
            error.message ||
            String(error)
          )
        );

      }

    }
  );


  bookListElement.appendChild(
    card
  );

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(
  message
) {

  loadingElement.textContent =
    message;


  loadingElement.style.display =
    "flex";

}


function hideLoading() {

  loadingElement.style.display =
    "none";

}


/* =========================================================
   ERROR
========================================================= */

function showError(
  message
) {

  console.error(
    message
  );


  errorElement.textContent =
    message;


  errorElement.style.display =
    "block";


  setTimeout(
    () => {

      errorElement.style.display =
        "none";

    },
    8000
  );

}


/* =========================================================
   START
========================================================= */

async function start() {


  try {


    showLoading(
      "Starting reader..."
    );


    /*
     * Open IndexedDB first.
     */

    await openDB();


    /*
     * Ask browser for persistent storage.
     */

    await requestPersistentStorage();


    /*
     * Display storage information in console.
     */

    await checkStorageSpace();


    /*
     * Look for the saved EPUB.
     */

    const savedBook =
      await getSavedBook();


    if (
      savedBook
    ) {


      /*
       * The book survived the previous session.
       */

      await openStoredBook(
        savedBook
      );

    }
    else {


      hideLoading();


      emptyElement.style.display =
        "flex";


      await renderLibrary();

    }

  }
  catch (error) {

    console.error(
      "Startup error:",
      error
    );


    showError(
      "Startup error: " +
      (
        error.message ||
        String(error)
      )
    );


    hideLoading();

  }

}


/* =========================================================
   PAGE VISIBILITY
========================================================= */


/*
 * Save the current position when the browser sends the page
 * into the background.
 */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.visibilityState ===
      "hidden"
    ) {

      savePosition();

    }

  }
);


/* =========================================================
   PAGE HIDE
========================================================= */

window.addEventListener(
  "pagehide",
  () => {

    savePosition();

  }
);


/* =========================================================
   START APPLICATION
========================================================= */

start();

</script>

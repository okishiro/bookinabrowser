<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>Offline EPUB Reader</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: #121212;
  color: #eeeeee;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}


/* =========================================================
   APP
========================================================= */

#app {

  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;

}


/* =========================================================
   TOP BAR
========================================================= */

#toolbar {

  height: 58px;
  min-height: 58px;

  display: flex;
  align-items: center;

  gap: 8px;

  padding: 8px 12px;

  background: #1b1b1b;

  border-bottom: 1px solid #333;

}


button {

  border: 0;

  border-radius: 7px;

  padding: 9px 13px;

  background: #303030;

  color: #eeeeee;

  font: inherit;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;

}


button:hover {

  background: #404040;

}


button:active {

  background: #4b4b4b;

}


#addButton {

  background: #1769aa;

}


#addButton:hover {

  background: #1d7fc7;

}


#fileInput {

  display: none;

}


#title {

  flex: 1;

  min-width: 0;

  text-align: center;

  font-size: 15px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

  color: #ddd;

}


/* =========================================================
   READER
========================================================= */

#reader {

  position: relative;

  flex: 1;

  min-height: 0;

  width: 100%;

  overflow: hidden;

  background: #121212;

}


/*
 * This is the actual reading area.
 */

#wordPage {

  width: 100%;
  height: 100%;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 35px;

  overflow: hidden;

  cursor: pointer;

  user-select: none;

  -webkit-user-select: none;

  touch-action: pan-y;

  -webkit-tap-highlight-color: transparent;

}


/* =========================================================
   TEXT
========================================================= */

#text {

  width: 100%;

  max-width: 850px;

  max-height: 100%;

  overflow: hidden;

  color: #eeeeee;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 22px;

  line-height: 1.8;

  text-align: justify;

  text-justify: inter-word;

  overflow-wrap: break-word;

}


/* =========================================================
   EMPTY SCREEN
========================================================= */

#empty {

  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  text-align: center;

  padding: 30px;

  color: #888;

  font-size: 17px;

  line-height: 1.7;

}


#empty strong {

  color: #ddd;

}


/* =========================================================
   CHAPTER INFO
========================================================= */

#chapterInfo {

  position: absolute;

  left: 0;

  right: 0;

  bottom: 12px;

  text-align: center;

  pointer-events: none;

  color: #666;

  font-size: 12px;

}


/* =========================================================
   LIBRARY
========================================================= */

#library {

  position: fixed;

  left: 0;
  top: 0;
  bottom: 0;

  width: 330px;

  max-width: 90vw;

  background: #1d1d1d;

  z-index: 50;

  transform: translateX(-100%);

  transition:
    transform .2s ease;

  box-shadow:
    8px 0 30px #0009;

  display: flex;

  flex-direction: column;

}


#library.open {

  transform: translateX(0);

}


#libraryHeader {

  height: 58px;

  min-height: 58px;

  display: flex;

  align-items: center;

  gap: 10px;

  padding: 10px 12px;

  border-bottom: 1px solid #333;

}


#libraryHeader h2 {

  margin: 0;

  flex: 1;

  font-size: 18px;

}


#bookList {

  flex: 1;

  overflow-y: auto;

  padding: 10px;

}


.book {

  position: relative;

  padding: 14px;

  margin-bottom: 9px;

  background: #2a2a2a;

  border-radius: 8px;

  cursor: pointer;

}


.book:hover {

  background: #353535;

}


.bookTitle {

  font-weight: 600;

  padding-right: 30px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}


.bookInfo {

  margin-top: 5px;

  color: #888;

  font-size: 12px;

}


.deleteBook {

  position: absolute;

  right: 7px;
  top: 7px;

  padding: 3px 8px;

  background: transparent;

  color: #888;

}


.deleteBook:hover {

  color: #ff6666;

  background: #444;

}


#emptyLibrary {

  color: #888;

  text-align: center;

  padding: 30px 15px;

  line-height: 1.6;

}


/* =========================================================
   LOADING
========================================================= */

#loading {

  position: absolute;

  inset: 0;

  z-index: 20;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #121212;

  color: #aaa;

}


/* =========================================================
   ERROR
========================================================= */

#error {

  position: fixed;

  left: 15px;
  right: 15px;

  bottom: 20px;

  z-index: 100;

  padding: 12px 15px;

  background: #9d2020;

  color: white;

  border-radius: 8px;

  display: none;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

  #toolbar {

    height: 54px;
    min-height: 54px;

    padding: 7px;

    gap: 5px;

  }


  button {

    padding: 8px 10px;

    font-size: 13px;

  }


  #title {

    font-size: 13px;

  }


  #wordPage {

    padding: 22px 18px 40px;

  }


  #text {

    font-size: 20px;

    line-height: 1.75;

  }

}


/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media (max-width: 380px) {

  #libraryButton {

    font-size: 0;

  }


  #libraryButton::before {

    content: "☰";

    font-size: 18px;

  }


  #addButton {

    font-size: 0;

  }


  #addButton::before {

    content: "+";

    font-size: 20px;

  }


  #text {

    font-size: 19px;

  }

}

</style>

  </div>

</div>

     ERROR

<script>

"use strict";


/* =========================================================
   SETTINGS
========================================================= */

const WORDS_PER_PAGE = 20;

const DB_NAME = "OfflineSingleEPUBReader";

const DB_VERSION = 1;

const BOOK_KEY = "single-book";

const POSITION_KEY = "reading-position";


/* =========================================================
   STATE
========================================================= */

let db = null;

let currentBook = null;

let words = [];

let currentWordPage = 0;

let totalWordPages = 0;

let currentChapter = 0;

let touchStartX = 0;

let touchStartY = 0;


/* =========================================================
   DOM
========================================================= */

const textElement =
  document.getElementById("text");

const wordPageElement =
  document.getElementById("wordPage");

const emptyElement =
  document.getElementById("empty");

const loadingElement =
  document.getElementById("loading");

const titleElement =
  document.getElementById("title");

const chapterInfoElement =
  document.getElementById("chapterInfo");

const fileInput =
  document.getElementById("fileInput");

const libraryElement =
  document.getElementById("library");

const bookListElement =
  document.getElementById("bookList");

const errorElement =
  document.getElementById("error");


/* =========================================================
   INDEXED DB
========================================================= */

function openDB() {

  return new Promise(
    (resolve, reject) => {

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        event => {

          const database =
            event.target.result;


          if (
            !database.objectStoreNames
              .contains("data")
          ) {

            database.createObjectStore(
              "data"
            );

          }

        };


      request.onsuccess =
        event => {

          db =
            event.target.result;

          resolve(db);

        };


      request.onerror =
        () => {

          reject(
            request.error
          );

        };

    }
  );

}


/* =========================================================
   DATABASE SAVE
========================================================= */

function saveData(
  key,
  value
) {

  return new Promise(
    (resolve, reject) => {

      const tx =
        db.transaction(
          "data",
          "readwrite"
        );


      tx.objectStore(
        "data"
      ).put(
        value,
        key
      );


      tx.oncomplete =
        () => resolve();


      tx.onerror =
        () => reject(
          tx.error
        );

    }
  );

}


/* =========================================================
   DATABASE GET
========================================================= */

function getData(key) {

  return new Promise(
    (resolve, reject) => {

      const tx =
        db.transaction(
          "data",
          "readonly"
        );


      const request =
        tx.objectStore(
          "data"
        ).get(key);


      request.onsuccess =
        () => {

          resolve(
            request.result
          );

        };


      request.onerror =
        () => {

          reject(
            request.error
          );

        };

    }
  );

}


/* =========================================================
   DATABASE DELETE
========================================================= */

function deleteData(key) {

  return new Promise(
    (resolve, reject) => {

      const tx =
        db.transaction(
          "data",
          "readwrite"
        );


      tx.objectStore(
        "data"
      ).delete(key);


      tx.oncomplete =
        () => resolve();


      tx.onerror =
        () => reject(
          tx.error
        );

    }
  );

}


/* =========================================================
   ZIP HELPERS
========================================================= */

function u16(
  array,
  offset
) {

  return (
    array[offset] |
    (array[offset + 1] << 8)
  );

}


function u32(
  array,
  offset
) {

  return (
    array[offset] |
    (array[offset + 1] << 8) |
    (array[offset + 2] << 16) |
    (array[offset + 3] << 24)
  ) >>> 0;

}


function decodeText(bytes) {

  return new TextDecoder(
    "utf-8"
  ).decode(bytes);

}


async function inflateRaw(data) {

  if (
    typeof DecompressionStream ===
    "undefined"
  ) {

    throw new Error(
      "This browser does not support EPUB ZIP decompression."
    );

  }


  const stream =
    new Blob([data])
      .stream()
      .pipeThrough(
        new DecompressionStream(
          "deflate-raw"
        )
      );


  return new Uint8Array(
    await new Response(
      stream
    ).arrayBuffer()
  );

}


/* =========================================================
   ZIP READER
========================================================= */

class ZipReader {

  constructor(buffer) {

    this.data =
      new Uint8Array(buffer);

    this.files =
      new Map();

    this.readDirectory();

  }


  readDirectory() {

    const a =
      this.data;


    let eocd = -1;


    /*
     * Search for End Of Central Directory.
     */

    for (
      let i = a.length - 22;

      i >= Math.max(
        0,
        a.length - 66000
      );

      i--
    ) {

      if (
        a[i] === 0x50 &&
        a[i + 1] === 0x4b &&
        a[i + 2] === 0x05 &&
        a[i + 3] === 0x06
      ) {

        eocd = i;

        break;

      }

    }


    if (eocd < 0) {

      throw new Error(
        "Invalid EPUB ZIP structure."
      );

    }


    const count =
      u16(
        a,
        eocd + 10
      );


    const offset =
      u32(
        a,
        eocd + 16
      );


    let position =
      offset;


    for (
      let i = 0;
      i < count;
      i++
    ) {

      if (
        a[position] !== 0x50 ||
        a[position + 1] !== 0x4b ||
        a[position + 2] !== 0x01 ||
        a[position + 3] !== 0x02
      ) {

        throw new Error(
          "Invalid ZIP central directory."
        );

      }


      const method =
        u16(
          a,
          position + 10
        );


      const compressedSize =
        u32(
          a,
          position + 20
        );


      const nameLength =
        u16(
          a,
          position + 28
        );


      const extraLength =
        u16(
          a,
          position + 30
        );


      const commentLength =
        u16(
          a,
          position + 32
        );


      const localOffset =
        u32(
          a,
          position + 42
        );


      const name =
        decodeText(
          a.slice(
            position + 46,
            position +
              46 +
              nameLength
          )
        );


      this.files.set(
        name,
        {
          method,
          compressedSize,
          localOffset
        }
      );


      position +=
        46 +
        nameLength +
        extraLength +
        commentLength;

    }

  }


  has(name) {

    return this.files.has(
      name.replace(
        /^\/+/,
        ""
      )
    );

  }


  async get(name) {

    name =
      name.replace(
        /^\/+/,
        ""
      );


    const info =
      this.files.get(
        name
      );


    if (!info) {

      throw new Error(
        "File not found: " +
        name
      );

    }


    const a =
      this.data;


    const position =
      info.localOffset;


    const nameLength =
      u16(
        a,
        position + 26
      );


    const extraLength =
      u16(
        a,
        position + 28
      );


    const start =
      position +
      30 +
      nameLength +
      extraLength;


    const compressed =
      a.slice(
        start,
        start +
          info.compressedSize
      );


    if (
      info.method === 0
    ) {

      return compressed;

    }


    if (
      info.method === 8
    ) {

      return await inflateRaw(
        compressed
      );

    }


    throw new Error(
      "Unsupported ZIP compression method."
    );

  }

}


/* =========================================================
   PATH HELPERS
========================================================= */

function normalizePath(path) {

  const parts = [];


  for (
    const part of
    path.split("/")
  ) {

    if (
      !part ||
      part === "."
    ) {

      continue;

    }


    if (
      part === ".."
    ) {

      parts.pop();

    }
    else {

      parts.push(part);

    }

  }


  return parts.join("/");

}


function dirname(path) {

  const index =
    path.lastIndexOf("/");


  if (
    index < 0
  ) {

    return "";

  }


  return path.slice(
    0,
    index
  );

}


function resolvePath(
  base,
  relative
) {

  if (
    relative.startsWith("/")
  ) {

    return normalizePath(
      relative
    );

  }


  return normalizePath(
    base
      ? base + "/" + relative
      : relative
  );

}


/* =========================================================
   EPUB BOOK
========================================================= */

class EPUBBook {

  constructor(buffer) {

    this.zip =
      new ZipReader(buffer);

    this.basePath = "";

    this.manifest =
      new Map();

    this.chapters = [];

  }


  async open() {

    if (
      !this.zip.has("mimetype")
    ) {

      throw new Error(
        "This file is not a valid EPUB."
      );

    }


    /*
     * Read container.xml
     */

    const container =
      new DOMParser()
        .parseFromString(
          decodeText(
            await this.zip.get(
              "META-INF/container.xml"
            )
          ),
          "application/xml"
        );


    const rootfile =
      container.querySelector(
        "rootfile"
      );


    if (!rootfile) {

      throw new Error(
        "EPUB package file not found."
      );

    }


    const opfPath =
      rootfile.getAttribute(
        "full-path"
      );


    this.basePath =
      dirname(opfPath);


    /*
     * Read package.opf
     */

    const opf =
      new DOMParser()
        .parseFromString(
          decodeText(
            await this.zip.get(
              opfPath
            )
          ),
          "application/xml"
        );


    /*
     * Manifest
     */

    for (
      const item of
      opf.querySelectorAll(
        "manifest > item"
      )
    ) {

      const id =
        item.getAttribute(
          "id"
        );


      const href =
        item.getAttribute(
          "href"
        );


      if (
        !id ||
        !href
      ) {

        continue;

      }


      this.manifest.set(
        id,
        {
          href,

          mediaType:
            item.getAttribute(
              "media-type"
            ),

          properties:
            item.getAttribute(
              "properties"
            ) || ""

        }
      );

    }


    /*
     * Spine
     */

    const spine =
      opf.querySelector(
        "spine"
      );


    if (!spine) {

      throw new Error(
        "EPUB has no spine."
      );

    }


    for (
      const ref of
      spine.querySelectorAll(
        "itemref"
      )
    ) {

      const id =
        ref.getAttribute(
          "idref"
        );


      const item =
        this.manifest.get(
          id
        );


      if (!item) {

        continue;

      }


      this.chapters.push({

        id,

        path:
          resolvePath(
            this.basePath,
            decodeURIComponent(
              item.href
                .split("#")[0]
            )
          ),

        title:
          "Chapter " +
          (
            this.chapters.length +
            1
          )

      });

    }


    /*
     * Read EPUB navigation.
     */

    await this.loadNavigation(
      opf
    );


    if (
      !this.chapters.length
    ) {

      throw new Error(
        "No readable chapters found."
      );

    }

  }


  async loadNavigation(opf) {

    /*
     * EPUB 3 navigation.
     */

    for (
      const item of
      this.manifest.values()
    ) {

      if (
        item.properties
          .split(/\s+/)
          .includes("nav")
      ) {

        const path =
          resolvePath(
            this.basePath,
            decodeURIComponent(
              item.href
            )
          );


        await this.parseNavigation(
          path
        );


        return;

      }

    }


    /*
     * EPUB 2 NCX
     */

    const spine =
      opf.querySelector(
        "spine"
      );


    if (!spine) {

      return;

    }


    const tocId =
      spine.getAttribute(
        "toc"
      );


    if (
      !tocId ||
      !this.manifest.has(
        tocId
      )
    ) {

      return;

    }


    const item =
      this.manifest.get(
        tocId
      );


    const path =
      resolvePath(
        this.basePath,
        decodeURIComponent(
          item.href
        )
      );


    await this.parseNCX(
      path
    );

  }


  async parseNCX(path) {

    try {

      const doc =
        new DOMParser()
          .parseFromString(
            decodeText(
              await this.zip.get(
                path
              )
            ),
            "application/xml"
          );


      for (
        const point of
        doc.querySelectorAll(
          "navPoint"
        )
      ) {

        const label =
          point.querySelector(
            "navLabel text"
          );


        const content =
          point.querySelector(
            "content"
          );


        if (
          !label ||
          !content
        ) {

          continue;

        }


        const src =
          content.getAttribute(
            "src"
          );


        if (!src) {

          continue;

        }


        const target =
          resolvePath(
            dirname(path),
            decodeURIComponent(
              src.split("#")[0]
            )
          );


        const index =
          this.chapters.findIndex(
            chapter =>
              chapter.path === target
          );


        if (
          index >= 0
        ) {

          this.chapters[index]
            .title =
              label.textContent.trim();

        }

      }

    }
    catch (e) {

      console.warn(
        "Could not read NCX:",
        e
      );

    }

  }


  async parseNavigation(path) {

    try {

      const doc =
        new DOMParser()
          .parseFromString(
            decodeText(
              await this.zip.get(
                path
              )
            ),
            "application/xhtml+xml"
          );


      const links =
        doc.querySelectorAll(
          "nav a"
        );


      for (
        const link of
        links
      ) {

        const href =
          link.getAttribute(
            "href"
          );


        if (!href) {

          continue;

        }


        const target =
          resolvePath(
            dirname(path),
            decodeURIComponent(
              href.split("#")[0]
            )
          );


        const index =
          this.chapters.findIndex(
            chapter =>
              chapter.path === target
          );


        if (
          index >= 0
        ) {

          const title =
            link.textContent.trim();


          if (title) {

            this.chapters[index]
              .title =
              title;

          }

        }

      }

    }
    catch (e) {

      console.warn(
        "Could not read navigation:",
        e
      );

    }

  }


  async getChapter(index) {

    const chapter =
      this.chapters[index];


    if (!chapter) {

      return null;

    }


    const bytes =
      await this.zip.get(
        chapter.path
      );


    return {

      index,

      path:
        chapter.path,

      title:
        chapter.title,

      html:
        decodeText(bytes)

    };

  }

}


/* =========================================================
   EXTRACT TEXT
========================================================= */

async function extractChapterText(
  chapter
) {

  const parser =
    new DOMParser();


  const document =
    parser.parseFromString(
      chapter.html,
      "text/html"
    );


  /*
   * Remove things that aren't readable text.
   */

  document
    .querySelectorAll(
      "script,style,noscript,iframe,object,embed"
    )
    .forEach(
      element =>
        element.remove()
    );


  /*
   * Get visible text.
   */

  let result =
    document.body
      ? document.body.innerText
      : document.documentElement.innerText;


  /*
   * Normalize whitespace.
   */

  result =
    result
      .replace(
        /\u00a0/g,
        " "
      )
      .replace(
        /\s+/g,
        " "
      )
      .trim();


  return result;

}


/* =========================================================
   LOAD ENTIRE BOOK TEXT
========================================================= */

async function loadBookText(
  book
) {

  let result = [];


  for (
    let i = 0;
    i < book.chapters.length;
    i++
  ) {

    const chapter =
      await book.getChapter(
        i
      );


    if (!chapter) {

      continue;

    }


    const chapterText =
      await extractChapterText(
        chapter
      );


    if (!chapterText) {

      continue;

    }


    /*
     * Add a small separation
     * between chapters.
     */

    result.push(
      chapterText
    );

  }


  return result.join(
    " "
  );

}


/* =========================================================
   WORD SPLITTER
========================================================= */

function splitWords(text) {

  if (!text) {

    return [];

  }


  return text
    .trim()
    .split(/\s+/)
    .filter(
      word =>
        word.length > 0
    );

}


/* =========================================================
   SHOW WORD PAGE
========================================================= */

function showWordPage() {

  if (!words.length) {

    textElement.textContent =
      "This book contains no readable text.";

    return;

  }


  const start =
    currentWordPage *
    WORDS_PER_PAGE;


  const end =
    Math.min(
      start +
        WORDS_PER_PAGE,
      words.length
    );


  const pageWords =
    words.slice(
      start,
      end
    );


  /*
   * textContent is intentional.
   *
   * It prevents EPUB HTML from
   * being executed or interpreted.
   */

  textElement.textContent =
    pageWords.join(" ");


  totalWordPages =
    Math.ceil(
      words.length /
      WORDS_PER_PAGE
    );


  chapterInfoElement.textContent =
    (
      currentWordPage + 1
    ) +
    " / " +
    totalWordPages;


  /*
   * Update title.
   */

  if (currentBook) {

    titleElement.textContent =
      currentBook.name;

  }


  savePosition();

}


/* =========================================================
   NEXT 20 WORDS
========================================================= */

function nextWords() {

  if (!words.length) {

    return;

  }


  if (
    currentWordPage <
    totalWordPages - 1
  ) {

    currentWordPage++;

    showWordPage();

  }

}


/* =========================================================
   PREVIOUS 20 WORDS
========================================================= */

function previousWords() {

  if (!words.length) {

    return;

  }


  if (
    currentWordPage > 0
  ) {

    currentWordPage--;

    showWordPage();

  }

}


/* =========================================================
   SAVE POSITION
========================================================= */

function savePosition() {

  if (!currentBook) {

    return;

  }


  saveData(
    POSITION_KEY,
    {

      page:
        currentWordPage,

      saved:
        Date.now()

    }
  )
  .catch(
    console.error
  );

}


/* =========================================================
   RESTORE POSITION
========================================================= */

async function restorePosition() {

  const position =
    await getData(
      POSITION_KEY
    );


  if (
    !position
  ) {

    currentWordPage = 0;

    return;

  }


  currentWordPage =
    Math.max(
      0,
      Math.min(
        position.page || 0,
        Math.max(
          0,
          totalWordPages - 1
        )
      )
    );

}


/* =========================================================
   OPEN BOOK
========================================================= */

async function openBook(
  storedBook
) {

  try {

    showLoading(
      "Opening book..."
    );


    currentBook =
      new EPUBBook(
        storedBook.data
      );


    currentBook.name =
      storedBook.name;


    await currentBook.open();


    showLoading(
      "Preparing book..."
    );


    const completeText =
      await loadBookText(
        currentBook
      );


    words =
      splitWords(
        completeText
      );


    totalWordPages =
      Math.ceil(
        words.length /
        WORDS_PER_PAGE
      );


    await restorePosition();


    emptyElement.style.display =
      "none";


    showWordPage();


    hideLoading();


    renderLibrary();

  }
  catch (e) {

    console.error(e);

    showError(
      "Could not open book: " +
      e.message
    );


    hideLoading();

  }

}


/* =========================================================
   ADD BOOK
========================================================= */

async function addBook(file) {

  try {

    showLoading(
      "Reading EPUB..."
    );


    const buffer =
      await file.arrayBuffer();


    /*
     * Validate the EPUB first.
     */

    const testBook =
      new EPUBBook(
        buffer
      );


    await testBook.open();


    /*
     * Save the complete EPUB
     * into IndexedDB.
     */

    await saveData(
      BOOK_KEY,
      {

        name:
          file.name,

        data:
          buffer,

        saved:
          Date.now()

      }
    );


    /*
     * Reset reading position
     * when a new book is added.
     */

    await saveData(
      POSITION_KEY,
      {

        page: 0,

        saved:
          Date.now()

      }
    );


    /*
     * Open the saved copy.
     */

    const savedBook =
      await getData(
        BOOK_KEY
      );


    await openBook(
      savedBook
    );

  }
  catch (e) {

    console.error(e);

    showError(
      "Could not add book: " +
      e.message
    );


    hideLoading();

  }

}


/* =========================================================
   FILE PICKER
========================================================= */

document
  .getElementById(
    "addButton"
  )
  .addEventListener(
    "click",
    () => {

      fileInput.click();

    }
  );


fileInput.addEventListener(
  "change",
  async event => {

    const file =
      event.target.files[0];


    if (file) {

      await addBook(
        file
      );

    }


    /*
     * Allows choosing the
     * same file again.
     */

    fileInput.value = "";

  }
);


/* =========================================================
   CLICK NAVIGATION
========================================================= */

wordPageElement.addEventListener(
  "click",
  event => {

    /*
     * Don't treat a swipe as a click.
     */

    if (
      Math.abs(
        touchStartX -
        event.clientX
      ) > 20
    ) {

      return;

    }


    if (!words.length) {

      return;

    }


    const width =
      wordPageElement
        .getBoundingClientRect()
        .width;


    /*
     * Click left side:
     * previous.
     *
     * Click right side:
     * next.
     */

    if (
      event.clientX <
      width / 2
    ) {

      previousWords();

    }
    else {

      nextWords();

    }

  }
);


/* =========================================================
   TOUCH START
========================================================= */

wordPageElement.addEventListener(
  "touchstart",
  event => {

    const touch =
      event.changedTouches[0];


    touchStartX =
      touch.clientX;


    touchStartY =
      touch.clientY;

  },
  {
    passive: true
  }
);


/* =========================================================
   TOUCH END
========================================================= */

wordPageElement.addEventListener(
  "touchend",
  event => {

    const touch =
      event.changedTouches[0];


    const endX =
      touch.clientX;


    const endY =
      touch.clientY;


    const deltaX =
      endX -
      touchStartX;


    const deltaY =
      endY -
      touchStartY;


    /*
     * Ignore mostly vertical gestures.
     */

    if (
      Math.abs(deltaX) <
      40
    ) {

      return;

    }


    if (
      Math.abs(deltaX) <
      Math.abs(deltaY)
    ) {

      return;

    }


    /*
     * Swipe LEFT:
     * next 20 words.
     */

    if (
      deltaX < 0
    ) {

      nextWords();

    }


    /*
     * Swipe RIGHT:
     * previous 20 words.
     */

    else {

      previousWords();

    }

  },
  {
    passive: true
  }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "ArrowRight"
    ) {

      nextWords();

    }


    if (
      event.key ===
      "ArrowLeft"
    ) {

      previousWords();

    }

  }
);


/* =========================================================
   LIBRARY
========================================================= */

document
  .getElementById(
    "libraryButton"
  )
  .addEventListener(
    "click",
    () => {

      libraryElement
        .classList
        .add("open");

      renderLibrary();

    }
  );


document
  .getElementById(
    "closeLibrary"
  )
  .addEventListener(
    "click",
    () => {

      libraryElement
        .classList
        .remove("open");

    }
  );


/* =========================================================
   RENDER LIBRARY
========================================================= */

async function renderLibrary() {

  const book =
    await getData(
      BOOK_KEY
    );


  bookListElement.innerHTML =
    "";


  if (!book) {

    bookListElement.innerHTML = `
      <div id="emptyLibrary">
        No book saved.
        <br><br>
        Add an EPUB to begin.
      </div>
    `;

    return;

  }


  const card =
    document.createElement(
      "div"
    );


  card.className =
    "book";


  const title =
    document.createElement(
      "div"
    );


  title.className =
    "bookTitle";


  title.textContent =
    book.name;


  const info =
    document.createElement(
      "div"
    );


  info.className =
    "bookInfo";


  info.textContent =
    "Stored on this device";


  const deleteButton =
    document.createElement(
      "button"
    );


  deleteButton.className =
    "deleteBook";


  deleteButton.textContent =
    "×";


  deleteButton.title =
    "Delete book";


  deleteButton.addEventListener(
    "click",
    async event => {

      event.stopPropagation();


      if (
        !confirm(
          "Delete this book from this device?"
        )
      ) {

        return;

      }


      await deleteData(
        BOOK_KEY
      );


      await deleteData(
        POSITION_KEY
      );


      currentBook =
        null;


      words = [];


      currentWordPage =
        0;


      totalWordPages =
        0;


      textElement.textContent =
        "";


      titleElement.textContent =
        "No book loaded";


      chapterInfoElement.textContent =
        "";


      emptyElement.style.display =
        "flex";


      renderLibrary();

    }
  );


  card.appendChild(
    title
  );


  card.appendChild(
    info
  );


  card.appendChild(
    deleteButton
  );


  card.addEventListener(
    "click",
    async () => {

      libraryElement
        .classList
        .remove("open");


      const savedBook =
        await getData(
          BOOK_KEY
        );


      if (savedBook) {

        await openBook(
          savedBook
        );

      }

    }
  );


  bookListElement.appendChild(
    card
  );

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(
  message
) {

  loadingElement.textContent =
    message;

  loadingElement.style.display =
    "flex";

}


function hideLoading() {

  loadingElement.style.display =
    "none";

}


/* =========================================================
   ERROR
========================================================= */

function showError(
  message
) {

  console.error(
    message
  );


  errorElement.textContent =
    message;


  errorElement.style.display =
    "block";


  setTimeout(
    () => {

      errorElement.style.display =
        "none";

    },
    7000
  );

}


/* =========================================================
   START
========================================================= */

async function start() {

  try {

    await openDB();


    const savedBook =
      await getData(
        BOOK_KEY
      );


    if (savedBook) {

      await openBook(
        savedBook
      );

    }
    else {

      hideLoading();

      renderLibrary();

    }

  }
  catch (e) {

    console.error(e);

    showError(
      "Startup error: " +
      e.message
    );


    hideLoading();

  }

}


start();

</script>
